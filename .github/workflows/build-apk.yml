name: Build Android Release APK

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Build split release APKs (Render production API)
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=API_BASE_URL=https://matdata-pulse.onrender.com/api

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: matdata-pulse-release-apks
          path: App/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30
