services:
  postgres:
    image: postgres:16-alpine
    container_name: matdata-pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matdata
      POSTGRES_PASSWORD: matdata_secret_change_me
      POSTGRES_DB: matdata_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matdata -d matdata_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: matdata-pulse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: matdata-pulse-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://matdata:matdata_secret_change_me@postgres:5432/matdata_pulse
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: replace-with-strong-32-char-access-secret
      JWT_REFRESH_SECRET: replace-with-strong-32-char-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - "5000:5000"

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: matdata-pulse-website
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
